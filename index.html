<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repositorio de Apps - 04/05/2026</title>
    <style>
        * { box-sizing: border-box; }

        body { 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            background: #1a1a1a; 
            color: #eee; 
            margin: 0; 
            padding: 20px; 
        }

        .container { max-width: 1000px; margin: auto; }
        
        h1 { 
            text-align: center; 
            color: #00d4ff; 
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 1.5rem;
            margin-bottom: 40px;
        }
        
        .categoria-title { 
            background: linear-gradient(90deg, transparent, #333, transparent);
            padding: 15px; 
            color: #ffca28; 
            font-size: 1.5rem; 
            margin: 40px 0 20px 0;
            text-align: center;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 3px;
        }

        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
            gap: 20px; 
        }

        .card { 
            background: #252525; 
            padding: 20px; 
            border-radius: 12px; 
            border: 1px solid #444; 
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .nombre { font-size: 1.1rem; font-weight: bold; color: #fff; margin-bottom: 10px; }
        .info { font-size: 0.9rem; color: #aaa; margin-bottom: 20px; }
        
        /* ESTILO DEL CÓDIGO AUTOCOPIABLE */
        .badge-code { 
            display: inline-block; 
            background: #263238; 
            color: #00d4ff; 
            padding: 6px 12px; 
            border-radius: 4px; 
            font-family: monospace; 
            font-weight: bold;
            border: 1px solid #00d4ff;
            cursor: pointer;
            transition: 0.2s;
            position: relative;
        }
        .badge-code:hover { background: #00d4ff; color: #000; }
        .badge-code:active { transform: scale(0.95); }

        /* Tooltip de "Copiado" */
        .badge-code.copied::after {
            content: "¡Copiado!";
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            background: #ffca28;
            color: #000;
            padding: 2px 8px;
            font-size: 10px;
            border-radius: 4px;
            font-family: sans-serif;
        }

        .btn { 
            display: block; 
            width: 100%; 
            text-align: center; 
            background: #00d4ff; 
            color: #000; 
            text-decoration: none; 
            padding: 12px 5px; 
            border-radius: 8px; 
            font-weight: bold; 
            text-transform: uppercase;
            font-size: 0.85rem;
            margin-top: auto;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>REPOSITORIO DE APLICACIONES</h1>
    <div id="contenido"></div>
</div>

<script>
    // Función para copiar al portapapeles
    function copiarCodigo(elemento, texto) {
        if (texto === "Pendiente") return;

        navigator.clipboard.writeText(texto).then(() => {
            elemento.classList.add('copied');
            setTimeout(() => {
                elemento.classList.remove('copied');
            }, 1500);
        });
    }

    async function cargarContenido() {
        try {
            const res = await fetch('datos.json');
            const data = await res.json();
            const mainDiv = document.getElementById('contenido');

            data.categorias.forEach(cat => {
                const section = document.createElement('div');
                section.innerHTML = `<div class="categoria-title">${cat.nombre}</div>`;
                
                const grid = document.createElement('div');
                grid.className = 'grid';

                cat.items.forEach(item => {
                    grid.innerHTML += `
                        <div class="card">
                            <div>
                                <span class="nombre"> ${item.nombre}</span>
                                <div class="info">
                                    <strong>Versión:</strong> ${item.version}<br>
                                    <strong>Fecha:</strong> ${item.fecha}<br><br>
                                    <strong>Downloader (Toca para copiar):</strong> <br>
                                    <span class="badge-code" onclick="copiarCodigo(this, '${item.codigo}')">${item.codigo}</span>
                                </div>
                            </div>
                            <a href="${item.enlace}" class="btn" target="_blank">Descargar APK</a>
                        </div>
                    `;
                });

                section.appendChild(grid);
                mainDiv.appendChild(section);
            });
        } catch (err) {
            console.error("Error al cargar JSON", err);
        }
    }
    cargarContenido();
</script>

</body>
</html>
